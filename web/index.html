<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Web</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fbfaf7; color: #222; }
  #bar { position: fixed; top: 12px; left: 12px; z-index: 2; display: flex; gap: 8px; align-items: center;
         background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 6px 10px; }
  #bar input { border: none; outline: none; font-size: 14px; width: 180px; }
  #bar a { font-size: 14px; color: #355; text-decoration: none; }
  #net { position: absolute; inset: 0; }
  #key { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #777; }
</style>
</head>
<body>
<div id="bar">
  <input id="find" placeholder="Find a document…" list="titles">
  <datalist id="titles"></datalist>
  <a href="pdf/book.pdf" target="_blank">Book</a>
</div>
<div id="net"></div>
<div id="key">Click a node to open it · arrows point from a document to what uses it · grey dashed = not written yet · faded = draft</div>
<script>
fetch("graph.json").then(r => r.json()).then(g => {
  const nodes = new vis.DataSet(g.nodes.map(n => ({
    id: n.id, label: n.label, url: n.url, title: n.ghost ? "Not written yet" : n.id,
    shape: "box", margin: 10,
    shapeProperties: { borderDashes: n.ghost ? [4, 4] : false },
    opacity: n.status === "draft" ? 0.55 : 1,
    borderWidth: n.failed ? 3 : 1,
    color: n.ghost ? { background: "#f1f1f1", border: "#aaa" }
         : { background: "#ffffff", border: n.failed ? "#c33" : "#355",
             highlight: { background: "#eef4f4", border: "#355" } },
    font: { color: n.ghost ? "#999" : "#222", face: "system-ui" }
  })));
  const edges = new vis.DataSet(g.edges.map(e => ({ from: e.from, to: e.to, arrows: "to",
    color: { color: "#bbb", highlight: "#355" } })));
  const net = new vis.Network(document.getElementById("net"), { nodes, edges }, {
    physics: { solver: "forceAtlas2Based", stabilization: { iterations: 200 } },
    interaction: { hover: true }
  });
  net.on("click", p => {
    if (!p.nodes.length) return;
    const n = nodes.get(p.nodes[0]);
    if (n.url) window.open(n.url, "_blank");
  });
  const list = document.getElementById("titles");
  g.nodes.forEach(n => { const o = document.createElement("option"); o.value = n.label; list.appendChild(o); });
  document.getElementById("find").addEventListener("change", ev => {
    const n = g.nodes.find(n => n.label === ev.target.value);
    if (n) { net.focus(n.id, { scale: 1.3, animation: true }); net.selectNodes([n.id]); }
  });
});
</script>
</body>
</html>
